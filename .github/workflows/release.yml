name: Build and deploy
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kfn-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: kfn_build
          POSTGRES_PASSWORD: kfn_build
          POSTGRES_DB: kfn_build
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U kfn_build"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: '5432'
      DATABASE_USER: kfn_build
      DATABASE_PASSWORD: kfn_build
      DATABASE_NAME: kfn_build
      NEXT_TELEMETRY_DISABLED: '1'
      S3_URL: ${{ vars.S3_PUBLIC_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22.23.1'
          cache: npm
      - run: python3 deploy/test-firstvds-receiver.py
      - run: npm ci --no-audit --no-fund
      - run: npm run migrate
      - run: npm run build
      - run: node scripts/package-release.mjs
      - name: Deploy standalone release to FirstVDS
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.FIRSTVDS_DEPLOY_ENABLED == 'true'
        env:
          DEPLOY_HOST: ${{ vars.FIRSTVDS_HOST }}
          DEPLOY_KEY: ${{ secrets.FIRSTVDS_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.FIRSTVDS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/firstvds-key"
          known="$RUNNER_TEMP/firstvds-known-hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known"
          trap 'rm -f "$key" "$known"' EXIT
          ssh -i "$key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$known" -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "deployer@$DEPLOY_HOST" "deploy $GITHUB_SHA-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT" < output/kfn.tgz
